<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickBookings — Contact</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a href="Home.html" class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 9.5V7a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2.5a2.5 2.5 0 0 0 0 5V17a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2.5a2.5 2.5 0 0 0 0-5z"/><path d="M15 6.5v11" stroke-dasharray="1.5 2"/></svg></span><span class="brand-name">Quick<i>Bookings</i></span></a>
      <nav>
        <ul class="nav-links" id="navLinks">
          <li><a href="Home.html">Home</a></li>
          <li><a href="Booking.html">Booking</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
          <li><a href="index.html" class="logout" onclick="localStorage.removeItem('loggedIn')">Logout</a></li>
        </ul>
      </nav>
      <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </header>

  <div class="page">
    <section class="section wrap contact-page">
      <div class="sec-head" style="text-align:center">
        <span class="eyebrow">Get In Touch</span>
        <h2>We're Here To <span class="grad-text">Help</span></h2>
      </div>

      <div class="contact-card">
        <aside class="contact-aside">
          <h3>Reach Us</h3>
          <div class="ci">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
            <div><small>Support 24×7</small><b>+91 98765 43210</b></div>
          </div>
          <div class="ci">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
            <div><small>Email</small><b>support@quickbookings.com</b></div>
          </div>
          <div class="ci">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
            <div><small>Box Office</small><b>Tamil Nadu, India</b></div>
          </div>
          <div class="ci">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
            <div><small>Hours</small><b>9:00 AM – 1:00 AM</b></div>
          </div>
        </aside>

        <form class="contact-form" id="contactForm" onsubmit="return false">
          <h2>Send a Message</h2>
          <div class="cf-row">
            <div class="cf-field">
              <label for="cf-name">Name</label>
              <input type="text" id="cf-name" name="name" placeholder="Your name" required />
            </div>
            <div class="cf-field">
              <label for="cf-phno">Phone</label>
              <input type="tel" id="cf-phno" name="phno" placeholder="Phone number" required />
            </div>
          </div>
          <div class="cf-field">
            <label for="cf-email">Email</label>
            <input type="email" id="cf-email" name="email" placeholder="you@email.com" required />
          </div>
          <div class="cf-field">
            <label for="cf-message">Message</label>
            <textarea id="cf-message" name="message" placeholder="How can we help?" required></textarea>
          </div>
          <button type="button" class="btn btn-primary btn-block" onclick="submitContact()">Send Message
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
          <p id="formMsg"></p>
        </form>
      </div>
    </section>
  </div>

  <script src="main.js"></script>
  <script>
    function submitContact() {
      const form = document.getElementById('contactForm');
      const msg = document.getElementById('formMsg');
      if (!form.checkValidity()) { form.reportValidity(); return; }
      msg.style.display = 'block';
      msg.style.color = '#3ddc84';
      msg.textContent = 'Thanks for your message! We will get back to you soon.';
      form.reset();
    }
  </script>
</body>
</html>
